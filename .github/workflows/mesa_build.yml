name: Android NDK Build (PanVK Native)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🟢 PURGA EN CALIENTE: revierte los "if false" residuales para evitar errores sintácticos
      - name: Purge Legacy Code Patches and Restore Factory Sources
        run: |
          echo "-> Purgando parches manuales previos en meson.build raiz..."
          if [ -f "meson.build" ]; then
            sed -i "s/if false # with_clc/if with_clc/g" meson.build 2>/dev/null || true
            sed -i "s/if false # dep_llvm.found()/if dep_llvm.found()/g" meson.build 2>/dev/null || true
            sed -i "s/dep_llvm = null_dep//g" meson.build 2>/dev/null || true
          fi
          
          echo "-> Purgando parches manuales previos en src/util/meson.build..."
          if [ -f "src/util/meson.build" ]; then
            sed -i "s/if false # with_platform_android/if with_platform_android/g" src/util/meson.build 2>/dev/null || true
          fi

      - name: Patch anon_file.c for memfd_create
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 🟢 CORRECCIÓN: Se actualizan los paquetes de LLVM y CLC a la versión explícita 18 compatible
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              gettext \
              llvm-18-dev \
              libclang-18-dev \
              libclc-18-dev
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

          # Inyección del Shim libclc en el Host para satisfacer el Setup raíz de la máquina virtual
          sudo mkdir -p /usr/lib/pkgconfig
          sudo cat << 'EOF' | sudo tee /usr/lib/pkgconfig/libclc.pc
          Name: libclc
          Description: Standalone libclc stub for Mesa host tools compilation
          Version: 1.0.0
          Cflags: -I/usr/include
          Libs: 
          EOF

      # GENERACIÓN DE EMULADORES DE HOST: Rompe el bloqueo de herramientas cruzadas e híbridas de clc
      - name: Generate Host Tools
        run: |
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools=panfrost \
              -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true \
              -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true

          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2

          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-cl-dummy"
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-clc"
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn_bindgen2" "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH

      # CONFIGURACIÓN DEL CROSS-FILE NATIVO DEL NDK DE GOOGLE
      - name: Configure Cross-File Matrix
        run: |
          cat << 'EOF' > android-cross.txt
          [binaries]
          c = '$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp = '$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar = '$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          envsubst < android-cross.txt > android-cross-compiled.txt

      # CONFIGURACIÓN DE MESON PURA DE VULKAN PANVK
      - name: Configure Meson
        run: |
          meson setup build \
              --cross-file android-cross-compiled.txt \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled \
              -Dpanfrost-kmds=kbase,panthor

      - name: Compile Project
        run: |
          meson compile -C build

      - name: Grant Execute Permissions to Package Script
        run: chmod +x ci-scripts/*.sh

      - name: Structure and Pack Final Container Package
        run: ./ci-scripts/package_wrapper.sh

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd
          path: wrapper.tzst
          if-no-files-found: error
