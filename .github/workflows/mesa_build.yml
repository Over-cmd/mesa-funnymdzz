name: Android NDK Build (Wrapper Variant)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          # SDK 30+ tiene memfd_create nativo en NDK
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c

      # SUSTITUCIÓN NATIVA DEL DRIVER: Cambia el nombre de compilación interno de Panfrost a Wrapper
      - name: Native Driver Rename from Panfrost to Wrapper
        run: |
          echo "-> Forzando a Meson a compilar el driver con identidad Wrapper de forma nativa..."
          sed -i 's/output : '\''libvulkan_panfrost.so'\''/output : '\''libvulkan_wrapper.so'\''/g' src/panfrost/vulkan/meson.build 2>/dev/null || true
          sed -i 's/name_prefix : '\''libvulkan_panfrost'\''/name_prefix : '\''libvulkan_wrapper'\''/g' src/panfrost/vulkan/meson.build 2>/dev/null || true
          sed -i 's/'\''vulkan_panfrost'\''/'\''vulkan_wrapper'\''/g' src/panfrost/vulkan/meson.build 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              llvm-dev \
              libclang-dev \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              gettext \
              zlib1g-dev \
              cargo \
              rustc
          
          # Detectamos dinámicamente la versión mayor de LLVM instalada en el entorno actual para evitar fallos de paquetes rotos
          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"
          echo "-> Detectada versión de LLVM del sistema: ${LLVM_MAJOR}"

          sudo apt-get install -y \
              "libclc-${LLVM_MAJOR}-dev" \
              "libllvmspirvlib-${LLVM_MAJOR}-dev" \
              "libclang-${LLVM_MAJOR}-dev"

          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Install and Pin Bindgen for Mesa
        run: |
          # Requerido explícitamente por el compilador Rust de PanVK para evitar fallos de alineación en estructuras de 1 byte
          cargo install --locked --version 0.72.1 bindgen-cli
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Generate Host Tools
        run: |
          echo "-> Configurando herramientas de compilación nativa de host..."
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools=panfrost \
              -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true \
              -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true
              
          # Se limita el enlazador pesado de las herramientas host a 2 hilos paralelos para proteger la RAM
          ninja -j 2 -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          
          ln -sf "build-host/src/compiler/clc/mesa_clc" "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Configure Meson
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt
          meson setup build --reconfigure \
              --cross-file android-cross.txt \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers="" \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled -Dpanfrost-kmds=kbase,panthor

      - name: Compile Project
        run: |
          # Limitamos la compilación a 2 trabajos paralelos para evitar el bloqueo del paso pesado final
          meson compile -C build --jobs 2

      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Limpiando estructuras previas..."
          rm -rf pkg
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          mkdir -p pkg/usr/share/vulkan/settings.d
          
          echo "-> Moviendo el binario generado de forma nativa..."
          # Buscamos el archivo bajo el nuevo nombre nativo que forzamos en el código fuente
          TARGET_SO=$(find build/ -name "libvulkan_wrapper.so" | head -n 1)
          if [ -n "$TARGET_SO" ] && [ -f "$TARGET_SO" ]; then
            cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_wrapper.so
            
            STRIP_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            if [ -f "$STRIP_BIN" ]; then
              $STRIP_BIN --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so
            else
              strip --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so
            fi
          else
            echo "ERROR: ¡No se encontró la librería compilada libvulkan_wrapper.so nativa!" && exit 1
          fi
          
          echo "-> Inyectando manifiestos JSON ICD limpios y optimizados..."
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"64","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"32","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          
          # Forzamos un perfil limpio que le dice a Winlator que ignore los volcados de CPU y active PanVK de forma segura
          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync","MESA_VK_FORCE_BLIT":"1"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json

          echo "-> Forzando versionado correcto para eliminar el 'Version: Unknown' de la pantalla"
          echo "msf:315508" > pkg/usr/version.txt

          echo "-> Ajustando permisos POSIX universales..."
          chmod -R 755 pkg/
          chmod 644 pkg/usr/lib/libvulkan_wrapper.so
          chmod 644 pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          chmod 644 pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          chmod 644 pkg/usr/version.txt

          echo "=== Inspección Estructural del Empaquetado ==="
          ls -R pkg
          echo "=============================================="

          echo "-> Comprimiendo la estructura dual ingresando de forma nativa con el flag -C..."
          tar -I 'zstd -19 -T0' -cf wrapper.tzst -C pkg usr

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd-${{ matrix.build-type }}
          path: wrapper.tzst
          if-no-files-found: error
