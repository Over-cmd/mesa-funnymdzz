name: Termux-Build of Mesa Vulkan Wrapper
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf gettext

      # 🔍 PASO DE DIAGNÓSTICO: Buscar el compilador real dentro del contenedor de leegao
      - name: Scan Contenedor for Android NDK and Compilers
        run: |
          echo "=== INVESTIGANDO EL CONTENEDOR DOCKER ==="
          docker run --rm --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            echo '-> Buscando variables de entorno de Android NDK...';
            env | grep -i ndk || true;
            echo '-> Localizando el binario clang de Android en el contenedor...';
            find / -name '*clang' -path '*ndk*' 2>/dev/null | head -n 10 || true;
            find /opt /usr /local -name '*clang*' 2>/dev/null | head -n 10 || true;
            echo '-> Comprobando si existen archivos cruzados preconfigurados...';
            find / -name '*cross*' -name '*.txt' -o -name '*.toml' 2>/dev/null | head -n 10 || true
          "

      # Generamos un cross-file básico para que no rompa el pipeline si pasa el setup
      - name: Generate Cross-File Template
        run: |
          cat << 'EOF' > android-cross.txt
          [binaries]
          c = ['aarch64-linux-android-clang']
          cpp = ['aarch64-linux-android-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          pkg_config_libdir = '/workspace/shims'
          EOF

      - name: Patch PanVK vkCreateInstance for Forced Initialization
        run: |
          PANVK_DEVICE=$(find src/ -name "*device.c" | head -n 1)
          if [ -n "$PANVK_DEVICE" ] && [ -f "$PANVK_DEVICE" ]; then
            sed -i 's/\r$//' "$PANVK_DEVICE"
            sed -i 's/instance->vk.enabled_extensions.KHR_get_physical_device_properties2/true/g' "$PANVK_DEVICE" 2>/dev/null || true
            sed -i 's/return vk_error(instance, VK_ERROR_INCOMPATIBLE_DRIVER);/return VK_SUCCESS;/g' "$PANVK_DEVICE" 2>/dev/null || true
          fi

      # Intentamos el setup. Si falla, el paso de diagnóstico de arriba ya nos habrá dejado las rutas en el log.
      - name: Run Wrapper Compiler via Guided Docker Container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            cd /workspace && \
            rm -rf ${{ env.BUILD_DIR }} && \
            meson setup ${{ env.BUILD_DIR }} --cross-file android-cross.txt -Dplatforms=android -Dvulkan-drivers=wrapper -Dgallium-drivers='' -Dbuildtype=release || true
          "
