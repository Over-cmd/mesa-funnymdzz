name: Termux-Build of Mesa Vulkan Wrapper
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf

      # 🛠️ DESBLOQUEO DE INSTANCIA EN C: Forzamos éxito en vkCreateInstance en los archivos fuente para tu Mali-G52
      - name: Patch PanVK vkCreateInstance for Forced Initialization
        run: |
          PANVK_DEVICE=$(find src/ -name "*device.c" | head -n 1)
          if [ -n "$PANVK_DEVICE" ] && [ -f "$PANVK_DEVICE" ]; then
            echo "-> Aplicando bypass de inicialización de instancia en código C..."
            sed -i 's/\r$//' "$PANVK_DEVICE"
            sed -i 's/instance->vk.enabled_extensions.KHR_get_physical_device_properties2/true/g' "$PANVK_DEVICE" 2>/dev/null || true
            sed -i 's/return vk_error(instance, VK_ERROR_INCOMPATIBLE_DRIVER);/return VK_SUCCESS;/g' "$PANVK_DEVICE" 2>/dev/null || true
          fi

      # 🟢 COMPILACIÓN PROTEGIDA: Dejamos que el entorno aislado del Docker oficial compile de forma nativa sin romper los scripts algebraicos de Python
      - name: Run Wrapper Compiler via Native Docker Container
        run: |
          echo "-> Compilando el código de forma segura dentro del contenedor Docker..."
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # 🟢 REESTRUCTURACIÓN EXT-ELF: Renombramos y parcheamos el binario final externamente para cumplir las reglas de Winlator
      - name: Structure and Pack wrapper.tzst
        run: |
          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          
          echo "-> Buscando el binario generado por el contenedor..."
          TARGET_SO=$(find ${{ env.BUILD_DIR }}/ -name "libvulkan_panfrost.so" -o -name "libvulkan_wrapper.so" | head -n 1)
          
          if [ -n "$TARGET_SO" ] && [ -f "$TARGET_SO" ]; then
            echo "-> Copiando y renombrando externamente el binario a libvulkan_wrapper.so..."
            cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_wrapper.so
            
            echo "-> Modificando la cabecera interna SONAME mediante patchelf para estabilizar vkCreateInstance..."
            patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
            
            STRIP_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            if [ -f "$STRIP_BIN" ]; then $STRIP_BIN --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so; else strip --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so; fi
          else
            echo "ERROR: ¡No se encontró ningún binario en ${{ env.BUILD_DIR }}! Revisa los logs de compilación de Docker." && exit 1
          fi
          
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"64","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"32","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json
          
          echo "msf:315508" > pkg/usr/version.txt
          chmod -R 755 pkg/ && chmod 644 pkg/usr/lib/libvulkan_wrapper.so pkg/usr/share/vulkan/icd.d/*.json pkg/usr/share/vulkan/settings.d/*.json pkg/usr/version.txt
          tar -I 'zstd -19 -T0' -cf wrapper.tzst -C pkg usr

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd
          path: wrapper.tzst
          if-no-files-found: error
