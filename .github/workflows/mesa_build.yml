name: Termux-Build of Mesa Vulkan Wrapper
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf gettext

      # 🟢 CORRECCIÓN HISTÓRICA: Forzamos a Meson a usar los binarios internos y seguros del contenedor Docker
      - name: Generate Cross-File Template
        run: |
          echo "-> Generando cross-file adaptado al entorno interno de Docker..."
          cat << 'EOF' > android-cross.txt
          [binaries]
          c = ['aarch64-linux-android30-clang']
          cpp = ['aarch64-linux-android30-clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          pkg_config_libdir = '/workspace/shims'
          EOF
          ls -la android-cross.txt

      # DESBLOQUEO DE INSTANCIA EN C: Forzamos éxito en vkCreateInstance en tu Mali-G52
      - name: Patch PanVK vkCreateInstance for Forced Initialization
        run: |
          PANVK_DEVICE=$(find src/ -name "*device.c" | head -n 1)
          if [ -n "$PANVK_DEVICE" ] && [ -f "$PANVK_DEVICE" ]; then
            echo "-> Aplicando bypass de inicialización de instancia en código C..."
            sed -i 's/\r$//' "$PANVK_DEVICE"
            sed -i 's/instance->vk.enabled_extensions.KHR_get_physical_device_properties2/true/g' "$PANVK_DEVICE" 2>/dev/null || true
            sed -i 's/return vk_error(instance, VK_ERROR_INCOMPATIBLE_DRIVER);/return VK_SUCCESS;/g' "$PANVK_DEVICE" 2>/dev/null || true
          fi

      # COMPILACIÓN MAESTRA DOCKER: Meson usará el entorno cruzado interno sin colapsar por rutas del host
      - name: Run Wrapper Compiler via Guided Docker Container
        run: |
          echo "-> Ejecutando reconfiguración nativa y compilación de wrapper dentro de Docker..."
          # Se añade la corrección de permisos al final del comando de bash para evitar bloqueos POSIX en el host
          docker run --rm -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            cd /workspace && \
            rm -rf ${{ env.BUILD_DIR }} && \
            meson setup ${{ env.BUILD_DIR }} --cross-file android-cross.txt -Dplatforms=android -Dvulkan-drivers=wrapper -Dgallium-drivers='' -Dbuildtype=release && \
            ninja -C ${{ env.BUILD_DIR }} src/panfrost/vulkan/libvulkan_wrapper.so && \
            chmod -R 777 ${{ env.BUILD_DIR }}
          "

      # REESTRUCTURACIÓN COMPATIBLE: Empaquetamos el binario nativo 'wrapper' directo para el instalador
      - name: Structure and Pack wrapper.tzst
        run: |
          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          TARGET_SO=$(find ${{ env.BUILD_DIR }}/ -name "libvulkan_wrapper.so" | head -n 1)
          if [ -n "$TARGET_SO" ] && [ -f "$TARGET_SO" ]; then
            echo "-> Moviendo la librería wrapper nativa al árbol de empaquetado..."
            cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_wrapper.so
            patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
            # Usamos el comando strip estándar del sistema para limpiar símbolos de depuración redundantes
            strip --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so
          else
            echo "ERROR: ¡No se encontró la librería libvulkan_wrapper.so en el directorio ${{ env.BUILD_DIR }}!" && exit 1
          fi
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"64","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"32","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json
          echo "msf:315508" > pkg/usr/version.txt
          chmod -R 755 pkg/ && chmod 644 pkg/usr/lib/libvulkan_wrapper.so pkg/usr/share/vulkan/icd.d/*.json pkg/usr/share/vulkan/settings.d/*.json pkg/usr/version.txt
          tar -I 'zstd -19 -T0' -cf wrapper.tzst -C pkg usr

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd
          path: wrapper.tzst
          if-no-files-found: error
