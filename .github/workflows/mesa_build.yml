name: PanVK kbase wrapper release (Docker-Leegao Flow)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ejecutamos el compilador en contenedor de Docker tal como lo hace Leegao
      - name: wrapper-compiler (Docker Run)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # Una vez que Docker termina de compilar, estructuramos para el instalador de Bannerlator
      - name: Stage runtime files for Bannerlator
        run: |
          echo "-> Inicializando empaquetado estructural solicitado (usr/lib y usr/share)..."
          rm -rf pkg
          mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d

          echo "-> Moviendo y renombrando el binario compilado por Docker..."
          # El compilador genera libvulkan_wrapper.so en la carpeta build/
          if [ -f "${{ env.BUILD_DIR }}/libvulkan_wrapper.so" ]; then
            cp -v "${{ env.BUILD_DIR }}/libvulkan_wrapper.so" pkg/usr/lib/libvulkan_panfrost_kbase.so
          else
            echo "ERROR: ¡No se encontró el binario compilado por Docker!" && exit 1
          fi

          # ====================================================================
          # CREACIÓN DEL MANIFIESTO ICD VÁLIDO (Previene errores de fin de archivo)
          # ====================================================================
          echo "-> Escribiendo manifiesto libvulkan_panfrost_kbase.aarch64.json..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json
{
    "file_format_version": "1.0.0",
    "ICD": {
        "library_path": "usr/lib/libvulkan_panfrost_kbase.so",
        "api_version": "1.1.0"
    }
}
EOF

          # ====================================================================
          # INYECCIÓN DEL ARCHIVO META PARA EL GESTOR DE BANNERLATOR
          # ====================================================================
          echo "-> Creando archivo meta.json para Bannerlator..."
          echo '{"name": "PanVK Panfrost Kbase Mod", "description": "Controlador Vulkan personalizado para GPUs Mali con soporte Kbase Kernel Driver", "type": "graphics_driver", "version": "1.0.0", "author": "Mesa Community / Mod", "compatibility": {"min_bannerlator_version": "3.0"}}' > pkg/meta.json

          echo "-> Asignando permisos POSIX..."
          chmod -R 755 pkg/
          echo "=== Árbol Estructural Preparado ==="
          ls -R pkg
          echo "===================================="

      - name: Compress and Structure Package
        run: |
          echo "-> Generando archivo comprimido .tzst con raíz usr/ y meta.json..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../PanVK_kbase_wrapper.tzst *
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-kbase-wrapper
          path: PanVK_kbase_wrapper.tzst
