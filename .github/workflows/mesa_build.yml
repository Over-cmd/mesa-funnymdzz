name: Android NDK Build (Wrapper Variant)

on: [push]

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: [debugoptimized, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          # SDK 30+ tiene memfd_create nativo en NDK
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              llvm-20-dev \
              libclang-20-dev \
              libclc-20-dev \
              libllvmspirvlib-20-dev \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              gettext # 🟢 CORRECCIÓN 1: Necesario para que funcione envsubst con android.toml
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Generate Host Tools
        run: |
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools=panfrost \
              -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true \
              -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "build-host/src/compiler/clc/mesa_clc" "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Configure Meson
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt
          meson setup build --reconfigure \
              --cross-file android-cross.txt \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android,x11 \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost_wrapper \ # 🟢 CORRECCIÓN 2: Se cambia 'panfrost' por 'panfrost_wrapper' para que enlace el código del fork
              -Dllvm=disabled -Dpanfrost-kmds=kbase,panthor

      - name: Compile Project
        run: |
          meson compile -C build

      - name: Structure and Pack wrapper.tzst
        run: |
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo y renombrando el archivo .so a libvulkan_wrapper.so..."
          cp build/src/panfrost/vulkan/libvulkan_panfrost.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando el manifiesto JSON con los nombres obligatorios del Wrapper original..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_arch": "64",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.1"
          }
          EOF
          
          echo "-> Inyectando el manifiesto JSON de 32 bits correspondiente..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_arch": "32",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.1"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd-${{ matrix.build-type }}
          path: wrapper.tzst
          if-no-files-found: error
