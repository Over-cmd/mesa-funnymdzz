name: Android NDK Build (PanVK Native via Local Scripts)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              gettext
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      # 🟢 PASO MAESTRO: Concedemos permisos totales de ejecución a toda tu artillería de scripts locales
      - name: Grant Execute Permissions to Local Scripts
        run: |
          chmod +x setup.sh compile.sh log.sh push.sh 2>/dev/null || true
          chmod +x ci-scripts/*.sh 2>/dev/null || true

      # 🟢 CONFIGURACIÓN NATIVA: Ejecutamos tu setup.sh oficial usando tu android.toml del repositorio
      - name: Run Native Setup Script
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          ./setup.sh

      # 🟢 COMPILACIÓN NATIVA: Tu script compile.sh se encarga de compilar y aplicar los empaquetados
      - name: Compile Project via Local Engine
        run: |
          ./compile.sh

      # RESCATE Y CONVERSIÓN COMPATIBLE CON WINLATOR
      - name: Structure and Pack Final Container Package
        run: ./ci-scripts/package_wrapper.sh

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd
          path: wrapper.tzst
          if-no-files-found: error
