name: Termux-Build of Mesa Vulkan Wrapper
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf

      # 🟢 PASO 1: Descarga interna segura de libcutils original
      - name: Checkout Standalone libcutils Repo
        uses: actions/checkout@v4
        with:
          repository: 'D-os/libcutils'
          ref: 'master'
          path: 'tmp_libcutils'

      # 🟢 PASO 2: Descarga interna segura de libhardware original de Android
      - name: Checkout Standalone libhardware Repo
        uses: actions/checkout@v4
        with:
          repository: 'D-os/libhardware'
          ref: 'master'
          path: 'tmp_libhardware'

      # Estructuramos y compilamos cutils y hardware originales de Android de forma local
      - name: Compile and Install Original Android Cutils & Hardware
        run: |
          echo "-> Estructurando el arbol de dependencias logicas locales..."
          mkdir -p shutils/system shutils/lib shutils/hardware
          
          echo "-> Copiando las cabeceras nativas reales de cutils..."
          if [ -d "tmp_libcutils/include/cutils" ]; then
            cp -r tmp_libcutils/include/cutils shutils/
          elif [ -d "tmp_libcutils/include_vndk/cutils" ]; then
            cp -r tmp_libcutils/include_vndk/cutils shutils/
          fi
          
          echo "-> Copiando las cabeceras nativas reales de hardware (HAL)..."
          cp -r tmp_libhardware/include/hardware/* shutils/hardware/ 2>/dev/null || true
          
          # Generamos una cabecera de compatibilidad para evitar bloqueos del compilador cruzado
          cat << 'EOF' > shutils/system/graphics.h
          #ifndef SYSTEM_GRAPHICS_H_
          #define SYSTEM_GRAPHICS_H_
          #include <stdint.h>
          #endif
          EOF
          
          echo "-> Compilando native_handle.cpp original de Android..."
          g++ -c -fPIC tmp_libcutils/native_handle.cpp -o tmp_libcutils/native_handle.o -Ishutils
          ar rcs shutils/lib/libcutils.a tmp_libcutils/native_handle.o
          
          # Compilamos un stub real de libhardware para satisfacer los simbolos del enlazador de Mesa
          echo "-> Compilando stub de enlace para libhardware.a..."
          cat << 'EOF' > shutils/stub_hardware.c
          #include <stdint.h>
          int hw_get_module(const char *id, const struct hw_module_t **module) { return -1; }
          int hw_get_module_by_class(const char *class_id, const char *inst, const struct hw_module_t **module) { return -1; }
          EOF
          gcc -c -fPIC shutils/stub_hardware.c -o shutils/stub_hardware.o -Ishutils
          ar rcs shutils/lib/libhardware.a shutils/stub_hardware.o

          echo "-> Generando archivo de configuracion pkg-config oficial para cutils..."
          cat << 'EOF' > shutils/cutils.pc
          Name: cutils
          Description: Standalone Android cutils library for Mesa
          Version: 1.0.0
          Cflags: -I/workspace/shutils
          Libs: -L/workspace/shutils/lib -lcutils
          EOF
          
          echo "-> Generando archivo de configuracion pkg-config oficial para hardware..."
          cat << 'EOF' > shutils/hardware.pc
          Name: hardware
          Description: Standalone Android hardware HAL library for Mesa
          Version: 1.0.0
          Cflags: -I/workspace/shutils
          Libs: -L/workspace/shutils/lib -lhardware
          EOF

          echo "-> Verificando entorno Android original unificado de Shims:"
          ls -R shutils/
          rm -rf tmp_libcutils tmp_libhardware

      # DESBLOQUEO DE INSTANCIA EN C: Forzamos éxito en vkCreateInstance en tu Mali-G52
      - name: Patch PanVK vkCreateInstance for Forced Initialization
        run: |
          PANVK_DEVICE=$(find src/ -name "*device.c" | head -n 1)
          if [ -n "$PANVK_DEVICE" ] && [ -f "$PANVK_DEVICE" ]; then
            echo "-> Aplicando bypass de inicialización de instancia en código C..."
            sed -i 's/\r$//' "$PANVK_DEVICE"
            sed -i 's/instance->vk.enabled_extensions.KHR_get_physical_device_properties2/true/g' "$PANVK_DEVICE" 2>/dev/null || true
            sed -i 's/return vk_error(instance, VK_ERROR_INCOMPATIBLE_DRIVER);/return VK_SUCCESS;/g' "$PANVK_DEVICE" 2>/dev/null || true
          fi

      # COMPILACIÓN MAESTRA DOCKER: Pasamos de forma transparente tus dependencias mediante PKG_CONFIG_PATH
      - name: Run Wrapper Compiler via Guided Docker Container
        run: |
          echo "-> Compilando wrapper de forma nativa usando la infraestructura interna de Docker..."
          docker run --rm -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            cd /workspace && \
            export PKG_CONFIG_PATH=/workspace/shutils && \
            rm -rf ${{ env.BUILD_DIR }} && \
            meson setup ${{ env.BUILD_DIR }} --cross-file /root/build-config/cross_file.txt -Dplatforms=android -Dvulkan-drivers=wrapper -Dgallium-drivers='' -Dbuildtype=release && \
            ninja -C ${{ env.BUILD_DIR }} src/panfrost/vulkan/libvulkan_wrapper.so && \
            chmod -R 777 ${{ env.BUILD_DIR }}
          "

      # REESTRUCTURACIÓN COMPATIBLE: Empaquetamos el binario nativo 'wrapper' directo para el instalador
      - name: Structure and Pack wrapper.tzst
        run: |
          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          TARGET_SO=$(find ${{ env.BUILD_DIR }}/ -name "libvulkan_wrapper.so" | head -n 1)
          if [ -n "$TARGET_SO" ] && [ -f "$TARGET_SO" ]; then
            echo "-> Moviendo la librería wrapper nativa al árbol de empaquetado..."
            cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_wrapper.so
            patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
            strip --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so
          else
            echo "ERROR: ¡No se encontró la librería libvulkan_wrapper.so en el directorio ${{ env.BUILD_DIR }}!" && exit 1
          fi
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"64","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"32","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json
          echo "msf:315508" > pkg/usr/version.txt
          chmod -R 755 pkg/ && chmod 644 pkg/usr/lib/libvulkan_wrapper.so pkg/usr/share/vulkan/icd.d/*.json pkg/usr/share/vulkan/settings.d/*.json pkg/usr/version.txt
          tar -I 'zstd -19 -T0' -cf wrapper.tzst -C pkg usr

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd
          path: wrapper.tzst
          if-no-files-found: error
