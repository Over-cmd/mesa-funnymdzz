name: Android NDK Build (Bifrost Automated Injected Variant)
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]
    steps:
      - name: Checkout repository actual (mesa-funnymdzz)
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
      
      - name: Checkout Bifrost Ecosystem from gamenative-wrapper
        uses: actions/checkout@v4
        with:
          repository: 'Over-cmd/gamenative-wrapper'
          ref: 'wrapper-25'
          path: 'tmp_gamenative'

      - name: Inject Bifrost Ecosystem Folders
        run: |
          echo "-> Limpiando directorios modernos e incompletos..."
          rm -rf src/panfrost/midgard src/panfrost/compiler src/panfrost/include src/panfrost/lib
          
          echo "-> Moviendo el ecosistema Bifrost completo al árbol de compilación actual..."
          cp -r tmp_gnav/src/panfrost/midgard src/panfrost/ || cp -r tmp_gamenative/src/panfrost/midgard src/panfrost/
          cp -r tmp_gnav/src/panfrost/compiler src/panfrost/ || cp -r tmp_gamenative/src/panfrost/compiler src/panfrost/
          cp -r tmp_gnav/src/panfrost/include src/panfrost/ || cp -r tmp_gamenative/src/panfrost/include src/panfrost/
          cp -r tmp_gnav/src/panfrost/lib src/panfrost/ || cp -r tmp_gamenative/src/panfrost/lib src/panfrost/
          rm -rf tmp_gamenative tmp_gnav 2>/dev/null || true
          
          # 🟢 CORRECCIÓN DE RUTA BIFROST: Reubicar archivos dentro de la subcarpeta que exige Meson
          echo "-> Estructurando subcarpeta compiler/bifrost..."
          if [ -d "src/panfrost/compiler" ] && [ ! -d "src/panfrost/compiler/bifrost" ]; then
            mkdir -p src/panfrost/compiler/bifrost_tmp
            mv src/panfrost/compiler/* src/panfrost/compiler/bifrost_tmp/ 2>/dev/null || true
            mv src/panfrost/compiler/bifrost_tmp src/panfrost/compiler/bifrost
          fi
          
          echo "-> Registrando subdirectorio en src/panfrost/meson.build..."
          sed -i "s/subdirs = \[/subdirs = \['midgard', /g" src/panfrost/meson.build 2>/dev/null || true
          
          echo "-> Corrigiendo de forma masiva las variables de cabecera heredadas..."
          find src/panfrost/ -name "meson.build" -exec sed -i 's/inc_panfrost_hw/inc_panfrost/g' {} + 2>/dev/null || true
          
          echo "-> Corrigiendo dependencias estáticas antiguas del compilador y enlazador..."
          find src/panfrost/ -name "meson.build" -exec sed -i 's/libpanfrost_midgard/libpanfrost_shared/g' {} + 2>/dev/null || true
          find src/panfrost/ -name "meson.build" -exec sed -i 's/libpanfrost_compiler/libpanfrost_shared/g' {} + 2>/dev/null || true
          find src/panfrost/ -name "meson.build" -exec sed -i 's/libpanfrost_bifrost/libpanfrost_lib/g' {} + 2>/dev/null || true
          find src/panfrost/ -name "meson.build" -exec sed -i 's/libpanfrost_util/libpanfrost_lib/g' {} + 2>/dev/null || true
          
          ls -la src/panfrost/midgard/meson.build

      - name: Redirect Panfrost Build Logic to Wrapper Identity natively
        run: |
          echo "-> Redireccionando la lógica de compilación de panfrost hacia la identidad wrapper..."
          sed -i "s/when : 'with_vulkan_icd_panfrost'/when : 'with_vulkan_icd_wrapper'/g" src/panfrost/vulkan/meson.build 2>/dev/null || true
          sed -i "s/with_vulkan_icd_panfrost =/with_vulkan_icd_wrapper =/g" meson.build 2>/dev/null || true
          sed -i "s/'panfrost' in vulkan_drivers/'wrapper' in vulkan_drivers/g" meson.build 2>/dev/null || true
          echo "-> Cambiando el nombre de salida del binario en las entrañas de Meson..."
          sed -i "s/output : 'libvulkan_panfrost'/output : 'libvulkan_wrapper'/g" src/panfrost/vulkan/meson.build 2>/dev/null || true
          sed -i "s/name_prefix : 'libvulkan_'/name_prefix : 'libvulkan_'/g" src/panfrost/vulkan/meson.build 2>/dev/null || true
          sed -i "s/'vulkan_panfrost'/'vulkan_wrapper'/g" src/panfrost/vulkan/meson.build 2>/dev/null || true
          echo "-> Redireccionando firmas de texto internas en archivos C..."
          find src/panfrost/vulkan/ -type f -name "*.c" -exec sed -i 's/"panfrost"/"wrapper"/g' {} + 2>/dev/null || true
      
      - name: Patch PanVK vkCreateInstance for Forced Initialization
        run: |
          PANVK_DEVICE=$(find src/ -name "*device.c" | head -n 1)
          if [ -n "$PANVK_DEVICE" ] && [ -f "$PANVK_DEVICE" ]; then
            sed -i 's/\r$//' "$PANVK_DEVICE"
            sed -i 's/instance->vk.enabled_extensions.KHR_get_physical_device_properties2/true/g' "$PANVK_DEVICE" 2>/dev/null || true
            sed -i 's/return vk_error(instance, VK_ERROR_INCOMPATIBLE_DRIVER);/return VK_SUCCESS;/g' "$PANVK_DEVICE" 2>/dev/null || true
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential llvm-dev libclang-dev libelf-dev spirv-tools bison flex libdrm-dev pkg-config gettext zlib1g-dev cargo rustc patchelf
          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"
          sudo apt-get install -y "libclc-${LLVM_MAJOR}-dev" "libllvmspirvlib-${LLVM_MAJOR}-dev" "libclang-${LLVM_MAJOR}-dev"
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging
      
      - name: Install and Pin Bindgen for Mesa
        run: |
          cargo install --locked --version 0.72.1 bindgen-cli
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      
      - name: Generate Host Tools
        run: |
          meson setup build-host -Dplatforms=[] -Dgallium-drivers=[] -Dvulkan-drivers=[] -Dtools=panfrost -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true -Dllvm=enabled -Dmesa-clc=enabled -Dinstall-mesa-clc=true
          ninja -j 2 -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "build-host/src/compiler/clc/mesa_clc" "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH
      
      - name: Configure Meson
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt
          meson setup build --reconfigure --cross-file android-cross.txt -Dbuildtype=${{ matrix.build-type }} -Dplatforms=android -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Dplatform-sdk-version=30 -Dglx=disabled -Dgbm=disabled -Degl=disabled -Dopengl=false -Dgles1=disabled -Dgles2=disabled -Dglvnd=disabled -Dvalgrind=disabled -Dgallium-drivers="" -Dshared-glapi=disabled -Dzstd=disabled -Dmesa-clc=system -Dprecomp-compiler=system -Dvulkan-drivers=wrapper -Dllvm=disabled -Dpanfrost-kmds=kbase,panthor
      
      - name: Compile Project
        run: |
          meson compile -C build --jobs 2
      
      - name: Structure and Pack wrapper.tzst
        run: |
          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          TARGET_SO=$(find build/ -name "libvulkan_wrapper.so" | head -n 1)
          if [ -n "$TARGET_SO" ] && [ -f "$TARGET_SO" ]; then
            cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_wrapper.so
            patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
            STRIP_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            if [ -f "$STRIP_BIN" ]; then $STRIP_BIN --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so; else strip --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so; fi
          else
            echo "ERROR: ¡No se encontró la librería libvulkan_wrapper.so generada de forma nativa!" && exit 1
          fi
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"64","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          echo '{"ICD":{"api_version":"1.4.352","library_arch":"32","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.1"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json
          echo "msf:315508" > pkg/usr/version.txt
          chmod -R 755 pkg/ && chmod 644 pkg/usr/lib/libvulkan_wrapper.so pkg/usr/share/vulkan/icd.d/*.json pkg/usr/share/vulkan/settings.d/*.json pkg/usr/version.txt
          tar -I 'zstd -19 -T0' -cf wrapper.tzst -C pkg usr
      
      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd-${{ matrix.build-type }}
          path: wrapper.tzst
          if-no-files-found: error
