name: PanVK kbase wrapper release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Patch Drivers and anon_file
        run: |
          echo "-> Aplicando parches de compatibilidad para Android..."
          if [ -f "src/util/anon_file.c" ]; then
            sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
          fi
          echo "-> Aplicando parche automático de core count a pan_device.c..."
          find . -name "pan_device.c" -exec sed -i 's/pan_query_core_count(&dev->kmod.dev->props, &dev->core_id_range);/dev->core_id_range = pan_query_core_count(\&dev->kmod.dev->props);/g' {} +
          find . -name "pan_device.c" -exec sed -i 's/\\&/\&/g' {} +

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential llvm-dev libclang-dev libelf-dev spirv-tools bison flex libdrm-dev pkg-config gettext cargo rustc
          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"
          echo "-> Detectada versión de LLVM: ${LLVM_MAJOR}"
          sudo apt-get install -y "libclc-${LLVM_MAJOR}-dev" "libllvmspirvlib-${LLVM_MAJOR}-dev" "libclang-${LLVM_MAJOR}-dev"
          python -m pip install --upgrade pip
          pip install mako PyYAML 'meson>=1.4.0' ninja packaging

      - name: Install and Pin Bindgen for Mesa
        run: |
          cargo install --locked --version 0.72.1 bindgen-cli
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Build Host Tools
        run: |
          echo "-> Compilando herramientas nativas de host..."
          meson setup build-host -Dplatforms=[] -Dgallium-drivers=[] -Dvulkan-drivers=[] -Dtools=panfrost -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true -Dllvm=enabled -Dmesa-clc=enabled -Dinstall-mesa-clc=true
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-clc"
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn_bindgen2" "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn-gen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Configure Cross-Compilation (Meson NDK)
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          echo "-> Procesando android.toml con envsubst..."
          envsubst < android.toml > android-cross.txt
          meson setup build --reconfigure --cross-file android-cross.txt -Dbuildtype=${{ matrix.build-type }} -Dplatforms=android -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Dplatform-sdk-version=30 -Dglx=disabled -Dgbm=disabled -Degl=disabled -Dopengl=false -Dgles1=disabled -Dgles2=disabled -Dglvnd=disabled -Dvalgrind=disabled -Dgallium-drivers=[] -Dshared-glapi=disabled -Dzstd=disabled -Dmesa-clc=system -Dprecomp-compiler=system -Dvulkan-drivers=panfrost -Dllvm=disabled -Dpanfrost-kmds=kbase,panthor

      - name: Compile Project
        run: |
          echo "-> Compilando driver PanVK para Android ARM64..."
          meson compile -C build

      - name: Stage runtime files for Bannerlator
        run: |
          echo "-> Inicializando empaquetado estructural con arquitectura compatible para Bannerlator..."
          rm -rf pkg
          mkdir -p pkg/d3d/syswow64 pkg/d3d/system32 pkg/share/vulkan/icd.d
          
          echo "-> Extrayendo y renombrando el binario original..."
          if [ -f "build/src/panfrost/vulkan/libvulkan_panfrost.so" ]; then
            cp -v "build/src/panfrost/vulkan/libvulkan_panfrost.so" pkg/d3d/system32/libvulkan_panfrost_kbase.so
            
            # Usar llvm-strip del NDK para evitar corrupciones de arquitectura cruzada
            STRIP_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            if [ -f "$STRIP_BIN" ]; then
              $STRIP_BIN --strip-unneeded pkg/d3d/system32/libvulkan_panfrost_kbase.so
            else
              strip --strip-unneeded pkg/d3d/system32/libvulkan_panfrost_kbase.so
            fi
          else
            echo "ERROR: ¡No se encontró el archivo compilado libvulkan_panfrost.so!" && exit 1
          fi
          
          echo "-> Vinculando el manifiesto ICD directamente en el árbol interno..."
          if [ -f "build/src/panfrost/vulkan/panfrost_icd.aarch64.json" ]; then
            cp -v "build/src/panfrost/vulkan/panfrost_icd.aarch64.json" pkg/share/vulkan/icd.d/panfrost_kbase_icd.aarch64.json
            
            # Corrección del sed: se elimina la coma final para mantener la validez estricta del archivo JSON
            sed -i 's|"library_path":.*|"library_path": "d3d/system32/libvulkan_panfrost_kbase.so"|g' pkg/share/vulkan/icd.d/panfrost_kbase_icd.aarch64.json
          else
            echo "ERROR: ¡No se encontró el manifiesto original!" && exit 1
          fi
          
          echo "-> Creando archivo meta.json para el Gestor de Bannerlator..."
          echo '{"name": "PanVK Panfrost Kbase Mod", "description": "Controlador Vulkan personalizado para GPUs Mali con soporte Kbase Kernel Driver", "type": "graphics_driver", "version": "1.0.0", "author": "Mesa Community / Mod", "compatibility": {"min_bannerlator_version": "3.0"}}' > pkg/meta.json
          
          echo "-> Asignando permisos POSIX..."
          chmod -R 755 pkg/
          echo "=== Árbol Estructural Preparado ==="
          ls -R pkg
          echo "===================================="

      - name: Compress and Structure Package
        run: |
          echo "-> Generando archivo comprimido .tzst limpio que Bannerlator validará..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../PanVK_kbase_wrapper.tzst *
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-kbase-wrapper
          path: PanVK_kbase_wrapper.tzst
