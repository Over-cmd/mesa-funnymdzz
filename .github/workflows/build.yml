name: Android NDK Build (PanVK Native via Local Scripts)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              gettext
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      # Concedemos permisos totales de ejecución a tu artillería de scripts locales
      - name: Grant Execute Permissions to Local Scripts
        run: |
          chmod +x setup.sh compile.sh log.sh push.sh 2>/dev/null || true
          chmod +x ci-scripts/*.sh 2>/dev/null || true

      # 🟢 PASO MAESTRO: Traduce las variables de tu android.toml en cadenas de texto físicas reales
      - name: Renderizar Cross-File y Ejecutar Setup Nativo
        run: |
          echo "-> Mapeando variables de entorno dinámicas en el archivo de configuración cruzada..."
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          
          echo "-> Generando archivo de configuración cruzada plano 'android-cross.txt'..."
          # envsubst lee las llaves ${} de tu android.toml y las reemplaza por las rutas reales de la VM
          envsubst < android.toml > android-cross.txt
          
          echo "-> Interceptando script local setup.sh para redirigir el cross-file generado..."
          # Reemplazamos la llamada rígida a 'android.toml' por nuestro archivo procesado plano
          sed -i 's/android.toml/android-cross.txt/g' setup.sh 2>/dev/null || true
          
          echo "-> Ejecutando el inicializador nativo de tu repositorio..."
          ./setup.sh

      # Tu script compile.sh se encarga de compilar y aplicar los empaquetados nativos mediante Ninja
      - name: Compile Project via Local Engine
        run: |
          ./compile.sh

      # RESCATE Y CONVERSIÓN COMPATIBLE CON WINLATOR
      - name: Structure and Pack Final Container Package
        run: ./ci-scripts/package_wrapper.sh

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd
          path: wrapper.tzst
          if-no-files-found: error
