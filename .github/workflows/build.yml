name: Termux-Build of Mesa Vulkan Wrapper

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf

      - name: Grant Execute Permissions to CI Scripts
        run: chmod +x ci-scripts/*.sh

      - name: Apply C bypass Patches to PanVK
        run: ./ci-scripts/patch_source.sh

      # 🟢 EL HACK INDESTRUCTIBLE: Neutralizamos por completo el bloque condicional de dependencias de Android
      - name: Bypass All Android Dependencies in Meson
        run: |
          echo "-> Neutralizando de raíz los bloques condicionales de Android en Meson..."
          # Forzamos que las condicionales de dependencias de Android evalúen siempre a falso en el script raíz
          sed -i "s/if with_platform_android/if false # with_platform_android/g" meson.build 2>/dev/null || true
          sed -i "s/with_platform_android/false/g" src/util/u_gralloc/meson.build 2>/dev/null || true

      # COMPILACIÓN MAESTRA DOCKER: Al evaluar a falso, Meson no buscará cutils, hardware, log ni sync
      - name: Run Wrapper Compiler via Guided Docker Container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            cd /workspace && \
            rm -rf ${{ env.BUILD_DIR }} && \
            meson setup ${{ env.BUILD_DIR }} --cross-file /root/build-config/cross_file.txt -Dplatforms=android -Dvulkan-drivers=wrapper -Dgallium-drivers='' -Dbuildtype=release && \
            ninja -C ${{ env.BUILD_DIR }} src/panfrost/vulkan/libvulkan_wrapper.so && \
            chmod -R 777 ${{ env.BUILD_DIR }}
          "

      - name: Structure and Pack Final Container Package
        run: ./ci-scripts/package_wrapper.sh

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Wrapper-Zstd
          path: wrapper.tzst
          if-no-files-found: error
