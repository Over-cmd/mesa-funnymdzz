name: PanVK kbase wrapper release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          echo "-> Aplicando parches de compatibilidad para Android..."
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
          
          echo "-> Aplicando parche automático a pan_device.c..."
          find . -name "pan_device.c" -exec sed -i 's/pan_query_core_count(&dev->kmod.dev->props, &dev->core_id_range);/dev->core_id_range = pan_query_core_count(\&dev->kmod.dev->props);/g' {} +
          find . -name "pan_device.c" -exec sed -i 's/\\&/\&/g' {} +

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            llvm-19-dev \
            libclang-19-dev \
            libclc-19-dev \
            libllvmspirvlib-19-dev \
            libelf-dev \
            spirv-tools \
            bison \
            flex \
            libdrm-dev \
            pkg-config \
            gettext

          python -m pip install --upgrade pip
          pip install mako PyYAML 'meson>=1.4.0' ninja packaging

      - name: Build Host Tools
        run: |
          echo "-> Compilando herramientas nativas de host (x86_64) para Mesa..."
          meson setup build-host \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true
            
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-cl-dummy" 2>/dev/null || true
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-clc"
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn_bindgen2" "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn-bindgen2"
          
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      # 🟢 PASO DE RESCATE: Crea accesos directos de los nombres de compilador viejos que busca android.toml hacia el clang moderno
      - name: Inject Google NDK Compiler Aliases
        run: |
          echo "-> Localizando binarios dentro del Android NDK provisto por el entorno..."
          NDK_BIN_DIR="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -d "$NDK_BIN_DIR" ]; then
            echo "-> Generando alias simbólicos para desatascar a Meson..."
            sudo ln -sf "$NDK_BIN_DIR/clang" "$NDK_BIN_DIR/aarch64-linux-android-clang"
            sudo ln -sf "$NDK_BIN_DIR/clang++" "$NDK_BIN_DIR/aarch64-linux-android-clang++"
            echo "-> ¡Alias inyectados correctamente!"
          else
            echo "🚨 ERROR: No se encontró el árbol de binarios del NDK." && exit 1
          fi

      - name: Configure Cross-Compilation (Meson NDK)
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          
          echo "-> Generando archivo de configuración cruzada android-cross.txt..."
          if [ -f "android.toml" ]; then
            envsubst < android.toml > android-cross.txt
          else
            echo "ERROR: ¡Falta el archivo android.toml en la raíz del repositorio!" && exit 1
          fi
          
          meson setup build --reconfigure \
            --cross-file android-cross.txt \
            -Dbuildtype=${{ matrix.build-type }} \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers=[] \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dpanfrost-kmds=kbase,panthor

      - name: Compile Project
        run: |
          echo "-> Ejecutando compilación cruzada hacia Android ARM64..."
          meson compile -C build

      - name: Structure and Pack wrapper.tzst for Bannerlator
        run: |
          echo "-> Creando estructura limpia para el cargador de Android..."
          rm -rf pkg
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Extrayendo binario libvulkan_panfrost.so de la compilación del NDK..."
          if [ -f "build/src/panfrost/vulkan/libvulkan_panfrost.so" ]; then
            cp -v "build/src/panfrost/vulkan/libvulkan_panfrost.so" pkg/usr/lib/libvulkan_panfrost_kbase.so
          else
            echo "ERROR: ¡El NDK no generó el binario .so esperado!" && exit 1
          fi

          echo "-> Creando manifiestos ICD JSON válidos (panfrost_kbase_icd)..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/panfrost_kbase_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_arch": "64",
                  "library_path": "libvulkan_panfrost_kbase.so"
              },
              "file_format_version": "1.0.1"
          }
          EOF

          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/panfrost_kbase_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_arch": "32",
                  "library_path": "libvulkan_panfrost_kbase.so"
              },
              "file_format_version": "1.0.1"
          }
          EOF

          sed -i 's/^[ \t]*//' pkg/usr/share/vulkan/icd.d/panfrost_kbase_icd.aarch64.json
          sed -i 's/^[ \t]*//' pkg/usr/share/vulkan/icd.d/panfrost_kbase_icd.arm.json
          
          echo "-> Ajustando permisos globales..."
          chmod 755 pkg/usr pkg/usr/lib pkg/usr/share pkg/usr/share/vulkan pkg/usr/share/vulkan/icd.d
          chmod 644 pkg/usr/lib/libvulkan_panfrost_kbase.so
          chmod 644 pkg/usr/share/vulkan/icd.d/panfrost_kbase_icd.aarch64.json
          chmod 644 pkg/usr/share/vulkan/icd.d/panfrost_kbase_icd.arm.json

          echo "=== Árbol Estructural del Paquete NDK ==="
          ls -R pkg
          echo "========================================="
          
          echo "-> Comprimiendo estructura dual en wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-NDK-Wrapper
          path: wrapper.tzst
