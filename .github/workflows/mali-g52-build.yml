name: Factoría Híbrida Mesa PanVK v301

on:
  workflow_dispatch:

jobs:
  build-mali:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el Repositorio de Over-cmd
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Saneamiento de Repositorios Host y Requisitos de Sistema
        run: |
          echo "========================================================="
          echo "🧬 DESVIANDO REPOSITORIOS CORRUPTOS DEL HOST DE GITHUB"
          echo "========================================================="
          # 🟢 EL EXTERMINADOR DE REPOS ROTOS:
          # Borramos de cuajo la lista de Google Chrome estable para evitar de forma 
          # matemática el colapso del 'Hash Sum mismatch' y el exit code 100.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google*.list
          
          # Forzamos una actualización limpia del resto del sistema operativo del Host
          sudo apt-get update || true
          
          echo "-> Instalando mangueras lógicas de Meson y Ninja..."
          sudo apt-get install -y meson ninja-build pkg-config envsubst python3 zstd zip

      - name: Configurar Entorno Cruzado de Android NDK (API 30)
        run: |
          echo "========================================================="
          echo "🔧 PREPARANDO LAS HERRAMIENTAS DE COMPILACIÓN CRUZADA"
          echo "========================================================="
          # Sincronizamos las mangueras lógicas del NDK oficial del runner
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Ejecutar la Línea de Montaje del Script de Over-cmd
        run: |
          echo "========================================================="
          echo "🚀 DETONANDO LA FORJA DIRECTA DEL CONTROLADOR MALI G52"
          echo "========================================================="
          chmod +x build_mali.sh
          ./build_mali.sh

      - name: Desplegar Artefacto 1 - ZIP Plano para Bannerlator/Winlator
        uses: actions/upload-artifact@v4
        with:
          name: panvk-bannerlator-driver
          path: ./panvk-bannerlator-driver.zip

      - name: Desplegar Artefacto 2 - TAR.ZST con Ramas Estructuradas de Android
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-android-system
          path: ./wrapper.tar.zst
